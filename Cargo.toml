[package]
name = "lens"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
globset = "0.4.22"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
streaming-iterator = "0.1.9"
tree-sitter = "0.27.2"
tree-sitter-python = "0.25.0"

[dev-dependencies]
tempfile = "3.27.0"
